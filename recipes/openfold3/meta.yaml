{% set name = "openfold3" %}
{% set version = "0.3.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/openfold3-{{ version }}.tar.gz
  sha256: f9a1d6169b19a9e4da6fe0df0530ff3f796ea60b66fa8e40f026fc429abb7a8d

build:
  entry_points:
    - run_openfold = openfold3.run_openfold:cli
    - setup_openfold = openfold3.setup_openfold:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.10
    - setuptools
    - wheel
    - pip
  run:
    - python >=3.10
    - awscli
    - pytorch
    - pytorch-lightning >=2.1
    - numpy
    - pandas
    - pyyaml
    - requests
    - scipy
    - tqdm
    - typing_extensions
    - wandb
    - ml-collections
    - mkl
    - aria2
    - biotite >=1.1.0,<1.3
    - rdkit
    - boto3
    - memory_profiler
    - func_timeout
    - lmdb
    - ijson
    - deepspeed
    - pdbeccdutils
    - nvidia-cutlass <4
    - cuda-python <12.9.1

test:
  imports:
    - openfold3
  commands:
    - pip check
    - run_openfold --help
  requires:
    - pip

about:
  home: https://github.com/aqlaboratory/openfold-3
  summary: OpenFold's Biological Structure Prediction Model based on DeepMind's AlphaFold 3
  license: Apache-2.0
  license_file: LICENSE
  doc_url: https://openfold-3.readthedocs.io/

extra:
  recipe-maintainers:
    - jnwei
    - sdvillal
    - dwhswenson
